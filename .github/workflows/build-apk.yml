name: Compilar y Publicar AuraFace Pro APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Auto-Scaffold & Build APK en Ubuntu Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Checkout del código fuente
        uses: actions/checkout@v3

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Auto-Generar estructura nativa Android
        run: |
          mkdir -p /tmp/auraface_backup
          cp pubspec.yaml /tmp/auraface_backup/
          cp -r lib /tmp/auraface_backup/
          flutter create --platforms=android --project-name auraface_pro --org com.auraface.studio .
          cp /tmp/auraface_backup/pubspec.yaml ./pubspec.yaml
          cp -r /tmp/auraface_backup/lib/* ./lib/

      - name: 5. Instalar dependencias y validar código
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: 6. Compilar APK Instalable (Release)
        run: |
          flutter build apk --release --split-per-abi

      - name: 7. Subir APKs listos para descargar
        uses: actions/upload-artifact@v3
        with:
          name: AuraFace-Studio-Pro-APK
          path: build/app/outputs/flutter-apk/app-*-release.apk

      - name: 8. Publicar APK directamente en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-*-release.apk
